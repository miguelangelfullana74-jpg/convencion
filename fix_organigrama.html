<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Corregir Organigrama - Hueco La Font</title>
<style>
  body { font-family: Arial, sans-serif; background: #0a0a0f; color: #f5ede0; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 16px; }
  .box { background: linear-gradient(135deg,#12121a,#1a1020); border: 1px solid rgba(201,168,76,.4); border-radius: 12px; padding: 32px; max-width: 540px; width: 100%; box-shadow: 0 0 60px rgba(0,0,0,.9); }
  h2 { color: #c9a84c; font-size: 1.2rem; margin: 0 0 8px; text-align: center; }
  p  { font-size: .85rem; color: rgba(245,237,224,.55); line-height: 1.6; text-align: center; margin-bottom: 20px; }
  .info { background: rgba(255,255,255,.04); border: 1px solid rgba(201,168,76,.2); border-radius: 8px; padding: 14px 18px; margin-bottom: 22px; font-size: .8rem; line-height: 1.9; }
  .info b { color: #4caf82; }
  .hueco { color: rgba(207,91,91,.7); font-style: italic; }
  button { padding: 13px 28px; background: linear-gradient(135deg,#8b1a1a,#5a0f0f); border: 1px solid rgba(201,168,76,.4); border-radius: 7px; color: #c9a84c; font-size: .9rem; font-weight: 700; letter-spacing: .1em; cursor: pointer; transition: all .2s; width: 100%; }
  button:hover:not(:disabled) { box-shadow: 0 5px 20px rgba(139,26,26,.5); transform: translateY(-1px); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  #log { margin-top: 18px; font-size: .78rem; line-height: 1.7; min-height: 40px; background: rgba(0,0,0,.3); border-radius: 6px; padding: 12px; display: none; max-height: 240px; overflow-y: auto; }
  .ok  { color: #4caf82; }
  .err { color: #cf5b5b; }
  .inf { color: #c9a84c; }
</style>
</head>
<body>
<div class="box">
  <h2>⚔ Corregir Organigrama (Moro + Cristiano)</h2>
  <p>Inserta un hueco vacío donde estaba <b>La Font de la Figuera</b>, justo antes de La Vila Joiosa, en <b>los dos bandos</b>.</p>

  <div class="info">
    El bloque quedará así:<br>
    <span class="hueco">— (hueco vacío) —</span><br>
    <b>La Vila Joiosa</b><br>
    🎼 BANDA<br>
    <b>LOlleria</b><br>
    <b>Los Alcazares</b><br>
    <br>
    El resto de poblaciones se mantienen en el mismo orden.
  </div>

  <button id="btn" onclick="aplicar()">APLICAR CAMBIOS</button>
  <div style="margin-top:16px;display:flex;flex-direction:column;gap:8px">
    <input id="email" placeholder="Email" value="miguelangelfullana74@gmail.com" style="padding:10px 12px;background:rgba(255,255,255,.06);border:1px solid rgba(201,168,76,.3);border-radius:5px;color:#f5ede0;font-size:.85rem">
    <input id="pass" type="password" placeholder="Contraseña" style="padding:10px 12px;background:rgba(255,255,255,.06);border:1px solid rgba(201,168,76,.3);border-radius:5px;color:#f5ede0;font-size:.85rem">
  </div>
  <div id="log"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script>
firebase.initializeApp({
  apiKey: "AIzaSyAwAXr0p8SJ4RBtmfAzqgQp-Jmhg-Flc1g",
  authDomain: "desfile-cocentaina.firebaseapp.com",
  databaseURL: "https://desfile-cocentaina-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "desfile-cocentaina",
  storageBucket: "desfile-cocentaina.firebasestorage.app",
  messagingSenderId: "771712428919",
  appId: "1:771712428919:web:19fbf932ef8773eead8f72"
});

var VACIO = '__VACIO__';

function log(msg, cls) {
  var d = document.getElementById('log');
  d.style.display = 'block';
  d.innerHTML += '<div class="' + (cls||'inf') + '">' + msg + '</div>';
  d.scrollTop = d.scrollHeight;
}

async function aplicar() {
  var btn = document.getElementById('btn');
  btn.disabled = true;
  btn.textContent = 'Conectando...';
  log('Autenticando...', 'inf');

  try {
    var em = document.getElementById('email').value.trim();
    var pw = document.getElementById('pass').value;
    if (!em || !pw) { log('✗ Escribe email y contraseña', 'err'); btn.disabled=false; btn.textContent='APLICAR CAMBIOS'; return; }
    await firebase.auth().signInWithEmailAndPassword(em, pw);
  } catch(e) {
    log('✗ Error de login: ' + e.message, 'err');
    btn.disabled = false; btn.textContent = 'REINTENTAR';
    return;
  }
  log('✓ Sesión iniciada', 'ok');

  var db = firebase.database();

  // Procesar AMBOS bandos
  var bandos = ['mora', 'cristiana'];
  for (var bi=0; bi<bandos.length; bi++) {
    var bando = bandos[bi];

    var snap = await db.ref('orgSlots/'+bando).once('value');
    var data = snap.val();
    if (!data) { log('⚠ No se encontró orgSlots/'+bando+', se omite', 'inf'); continue; }

    // Convertir a array ordenado
    var keys = Object.keys(data).sort(function(a,b){return parseInt(a)-parseInt(b);});
    var arr = [];
    for (var i=0; i<keys.length; i++) {
      var v = data[keys[i]];
      if (v === null || v === undefined || v === VACIO) arr.push(null);
      else if (typeof v === 'string') arr.push(v);
      else if (typeof v === 'object' && v.pob) arr.push(v.pob);
      else arr.push(null);
    }

    log('— Bando ' + bando.toUpperCase() + ': ' + arr.length + ' posiciones —', 'inf');

    // Buscar "La Vila Joiosa" e insertar hueco justo antes
    var idxVila = arr.indexOf('La Vila Joiosa');
    if (idxVila < 0) {
      log('  ⚠ No se encontró "La Vila Joiosa", se omite este bando', 'err');
      continue;
    }

    if (idxVila > 0 && arr[idxVila-1] === null) {
      log('  ⚠ Ya hay un hueco antes de La Vila Joiosa', 'inf');
    } else {
      arr.splice(idxVila, 0, null);
      log('  ✓ Hueco insertado antes de La Vila Joiosa', 'ok');
    }

    // Guardar (null -> VACIO)
    var toSave = [];
    for (var i=0; i<arr.length; i++) toSave.push(arr[i] === null ? VACIO : arr[i]);
    await db.ref('orgSlots/'+bando).set(toSave);
    log('  ✓ Guardado (' + toSave.length + ' posiciones)', 'ok');
  }

  log('', '');
  log('✅ ¡LISTO! Hueco puesto en MORO y CRISTIANO. Abre el programa.', 'ok');
  btn.textContent = '✓ HECHO';
}
</script>
</body>
</html>
